
<!-- PAYPAL -->
<script>
    // Digital products: payment and download handled by app.py
    function renderDigitalProductPayPal(selector, productId) {
        const container = document.querySelector(selector);

        if (!container || !window.paypal) {
            console.error("PayPal unavailable:", selector);
            return;
        }

        paypal.Buttons({
            style: {
                color: "blue",
                shape: "pill",
                label: "pay",
                height: 40
            },

            createOrder: async function () {
                const response = await fetch("/api/paypal/create-order", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        product_id: productId
                    })
                });

                const result = await response.json();

                if (!response.ok || !result.orderID) {
                    throw new Error(
                        result.error || "Could not create payment order."
                    );
                }

                return result.orderID;
            },

            onApprove: async function (data) {
                const response = await fetch("/api/paypal/capture-order", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        orderID: data.orderID
                    })
                });

                const result = await response.json();

                if (
                    !response.ok ||
                    !result.success ||
                    !result.download_url
                ) {
                    throw new Error(
                        result.error || "Payment confirmation failed."
                    );
                }

                const link = document.createElement("a");
                link.href = result.download_url;
                link.textContent = "Download your product";
                link.style.display = "block";
                link.style.marginTop = "12px";
                link.style.fontWeight = "bold";
                link.style.textAlign = "center";

                container.replaceChildren(link);

                alert(
                    "Payment confirmed! Click the download link to get your product."
                );
            },

            onError: function (error) {
                console.error("Digital product payment error:", error);
                alert(
                    "Payment or download failed. Please try again."
                );
            }
        }).render(container);
    }


    // Editing services: separate payment flow
    function renderServicePayPal(selector, amount) {
        const container = document.querySelector(selector);

        if (!container || !window.paypal) {
            console.error("PayPal unavailable:", selector);
            return;
        }

        paypal.Buttons({
            style: {
                color: "blue",
                shape: "pill",
                label: "pay",
                height: 40
            },

            createOrder: function (data, actions) {
                return actions.order.create({
                    purchase_units: [{
                        amount: {
                            currency_code: "USD",
                            value: amount
                        }
                    }]
                });
            },

            onApprove: function (data, actions) {
                return actions.order.capture().then(function (details) {
                    const firstName =
                        details.payer &&
                        details.payer.name &&
                        details.payer.name.given_name
                            ? details.payer.name.given_name
                            : "customer";

                    alert(
                        "Payment successful! Thanks " + firstName +
                        ". Please use the contact form to send your editing requirements."
                    );
                });
            },

            onError: function (error) {
                console.error("Service payment error:", error);
                alert("PayPal encountered an error. Please try again.");
            }
        }).render(container);
    }


    window.addEventListener("load", function () {
        if (!window.paypal) {
            console.error("PayPal SDK did not load.");
            alert("PayPal could not load. Please refresh the page.");
            return;
        }

        // Editing services
        renderServicePayPal("#paypal-basic", "10");
        renderServicePayPal("#paypal-standard", "25");
        renderServicePayPal("#paypal-premium", "40");

        // Digital products: IDs must match those in app.py
        renderDigitalProductPayPal(
            "#paypal-planner",
            "content-planner"
        );

        renderDigitalProductPayPal(
            "#paypal-ebook",
            "youtube-growth-guide"
        );
    });
</script>
